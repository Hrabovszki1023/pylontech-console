[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylontech-console"
version = "0.0.0"
description = "Pylontech Console reference implementation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.50",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "types-pyyaml",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true
