services:
  pylontech-console:
    image: hrabovszki/pylontech-console:${PYLONTECH_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      PYLONTECH_HTTP_HOST: 0.0.0.0
      PYLONTECH_HTTP_PORT: 8000
      PYLONTECH_WAVESHARE_HOST: ${PYLONTECH_WAVESHARE_HOST:?set PYLONTECH_WAVESHARE_HOST in .env}
      PYLONTECH_WAVESHARE_PORT: ${PYLONTECH_WAVESHARE_PORT:-4196}
      PYLONTECH_WAVESHARE_CONNECT_TIMEOUT_SECONDS: ${PYLONTECH_WAVESHARE_CONNECT_TIMEOUT_SECONDS:-5}
      PYLONTECH_WAVESHARE_RESPONSE_TIMEOUT_SECONDS: ${PYLONTECH_WAVESHARE_RESPONSE_TIMEOUT_SECONDS:-5}
      PYLONTECH_CONSOLE_LOGIN_PASSWORD_FILE: /run/secrets/pylontech_console_password
      PYLONTECH_POLLING_RACK_INTERVAL_SECONDS: ${PYLONTECH_POLLING_RACK_INTERVAL_SECONDS:-5}
      PYLONTECH_POLLING_MODULE_INTERVAL_SECONDS: ${PYLONTECH_POLLING_MODULE_INTERVAL_SECONDS:-60}
      PYLONTECH_POLLING_INVENTORY_INTERVAL_SECONDS: ${PYLONTECH_POLLING_INVENTORY_INTERVAL_SECONDS:-300}
      PYLONTECH_POLLING_STALE_AFTER_MULTIPLIER: ${PYLONTECH_POLLING_STALE_AFTER_MULTIPLIER:-2}
      PYLONTECH_WEB_HEATMAP_DEADBAND_MV: ${PYLONTECH_WEB_HEATMAP_DEADBAND_MV:-2}
      PYLONTECH_WEB_HEATMAP_SCALE_MV: ${PYLONTECH_WEB_HEATMAP_SCALE_MV:-50}
      PYLONTECH_WEB_CELL_LOW_WARNING_MV: ${PYLONTECH_WEB_CELL_LOW_WARNING_MV:-3100}
      PYLONTECH_WEB_CELL_LOW_CRITICAL_MV: ${PYLONTECH_WEB_CELL_LOW_CRITICAL_MV:-3000}
      PYLONTECH_WEB_CELL_HIGH_BALANCING_MV: ${PYLONTECH_WEB_CELL_HIGH_BALANCING_MV:-3547}
      PYLONTECH_WEB_CELL_HIGH_WARNING_MV: ${PYLONTECH_WEB_CELL_HIGH_WARNING_MV:-3600}
      PYLONTECH_MQTT_ENABLED: ${PYLONTECH_MQTT_ENABLED:-false}
      PYLONTECH_MQTT_HOST: ${PYLONTECH_MQTT_HOST:-}
      PYLONTECH_MQTT_PORT: ${PYLONTECH_MQTT_PORT:-1883}
      PYLONTECH_MQTT_CLIENT_ID: ${PYLONTECH_MQTT_CLIENT_ID:-pylontech-console}
      PYLONTECH_MQTT_USERNAME: ${PYLONTECH_MQTT_USERNAME:-}
      PYLONTECH_MQTT_PASSWORD: ${PYLONTECH_MQTT_PASSWORD:-}
      PYLONTECH_MQTT_TOPIC_PREFIX: ${PYLONTECH_MQTT_TOPIC_PREFIX:-pylontech}
      PYLONTECH_MQTT_KEEPALIVE_SECONDS: ${PYLONTECH_MQTT_KEEPALIVE_SECONDS:-60}
      PYLONTECH_MQTT_CONNECT_TIMEOUT_SECONDS: ${PYLONTECH_MQTT_CONNECT_TIMEOUT_SECONDS:-5}
      PYLONTECH_MQTT_RECONNECT_MIN_SECONDS: ${PYLONTECH_MQTT_RECONNECT_MIN_SECONDS:-1}
      PYLONTECH_MQTT_RECONNECT_MAX_SECONDS: ${PYLONTECH_MQTT_RECONNECT_MAX_SECONDS:-60}
      PYLONTECH_MQTT_TLS_ENABLED: ${PYLONTECH_MQTT_TLS_ENABLED:-false}
      PYLONTECH_MQTT_TLS_CA_FILE: ${PYLONTECH_MQTT_TLS_CA_FILE:-}
      PYLONTECH_MQTT_TLS_CERT_FILE: ${PYLONTECH_MQTT_TLS_CERT_FILE:-}
      PYLONTECH_MQTT_TLS_KEY_FILE: ${PYLONTECH_MQTT_TLS_KEY_FILE:-}
      PYLONTECH_MQTT_TLS_INSECURE: ${PYLONTECH_MQTT_TLS_INSECURE:-false}
    ports:
      - "${PYLONTECH_HTTP_PUBLISHED_PORT:-8001}:8000"
    secrets:
      - pylontech_console_password

secrets:
  pylontech_console_password:
    file: ${PYLONTECH_CONSOLE_PASSWORD_FILE_HOST:-./secrets/pylontech-console-password.txt}
