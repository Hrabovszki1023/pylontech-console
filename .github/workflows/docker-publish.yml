name: Verify and publish Docker image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: hrabovszki/pylontech-console

jobs:
  verify:
    name: Verify Python project
    runs-on: ubuntu-latest
    outputs:
      public-version: ${{ steps.identity.outputs.public-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate public and development Compose configurations
        shell: bash
        run: |
          mkdir -p secrets
          printf '%s\n' '<redacted>' > secrets/pylontech-console-password.txt
          PYLONTECH_WAVESHARE_HOST=192.0.2.1 docker compose config >/dev/null
          PYLONTECH_WAVESHARE_HOST=192.0.2.1 \
            docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            config >/dev/null

      - name: Verify release identity
        id: identity
        shell: bash
        run: |
          public_version="$(
            PYTHONPATH=src python -c \
              'from pylontech_console.version import PUBLIC_VERSION; print(PUBLIC_VERSION)'
          )"
          PYTHONPATH=src python -c \
            'import os; from pylontech_console.version import validate_release_tag; validate_release_tag(os.environ["GITHUB_REF_TYPE"], os.environ["GITHUB_REF_NAME"])'
          echo "public-version=$public_version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run MyPy
        run: python -m mypy src tests

  image:
    name: Build and publish linux/amd64 image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Pylontech Console
            org.opencontainers.image.description=Read-only Pylontech battery monitoring service
            org.opencontainers.image.version=${{ needs.verify.outputs.public-version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYLONTECH_BUILD_VERSION=${{ needs.verify.outputs.public-version }}
            PYLONTECH_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
